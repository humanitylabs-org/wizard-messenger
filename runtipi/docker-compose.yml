services:
  unified-init:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    user: "0:0"
    entrypoint: [python3, /app/unified_setup.py]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    restart: "no"
    labels:
      runtipi.managed: 'false'
  messenger:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    read_only: true
    cap_drop: [ALL]
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /run/messenger:rw,noexec,nosuid,size=64m,mode=0700,uid=1000,gid=1000
    environment:
      MESSENGER_API_TOKEN: ${MESSENGER_API_TOKEN:?Messenger capability required}
      MESSENGER_ALLOWED_ORIGINS: ${MESSENGER_ALLOWED_ORIGINS:-}
      MESSENGER_PUBLIC_PATH: ${MESSENGER_PUBLIC_PATH:-/messenger/}
      MESSENGER_COOKIE_SECURE: "1"
      MESSENGER_DATA: /data
      MESSENGER_PORT: "8765"
      # Issue 325: Messenger's own Agent Service app token (app-tokens/messenger), handed
      # over by the App Manager (wizard-app-manager 804). Without it the Agent chat keeps its own list.
      MESSENGER_AGENT_INBOX_TOKEN: ${MESSENGER_AGENT_INBOX_TOKEN:-}
      MESSENGER_AGENT_SERVICE: ${MESSENGER_AGENT_SERVICE:-http://wizard-agent-service:8787}
      # Issue 234: what /healthz and MCP report. The release bumps it with config.json and wizard.md.
      MESSENGER_VERSION: "0.2.0-unified.16.148"
      UNIFIED_ENABLED: "1"
      CONNECTORS_ENABLED: "1"
      MESSENGER_CONNECTOR_SENDER_MODE: local-owner
      MATRIX_URL: http://matrix:8008
      TELEGRAM_BRIDGE_URL: http://telegram:29317
      TRANSLATION_URL: http://translation:8766
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gemma4-31b}
      MESSENGER_BROWSER_DEVTOOLS: http://signin-browser:9222
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      unified-init: {condition: service_completed_successfully}
      matrix: {condition: service_healthy}
      connector-init: {condition: service_completed_successfully}
    networks: [matrix-lane, model-lane, relay-egress, signin-lane, call-lane, tunnel-lane]
    # Issue 266: for the Agent chat wake, the owner's agent can name its event inbox on this Wizard as host.docker.internal.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Loopback-only host port for the Wizard gateway, as in 0.1.x.
    ports:
      - 127.0.0.1:${APP_PORT}:8765
    x-runtipi:
      is_main: true
      internal_port: 8765
  matrix:
    # Official Synapse v1.166.0 multi-architecture manifest (tag for Dependabot, digest is what runs).
    image: ghcr.io/element-hq/synapse:v1.166.0@sha256:2cdc84f1de4687af89e4b7b1fe7b5f93e0ee7913243b63f79b05319cb6a8f525
    user: "1000:1000"
    # Issue 451: unified-init puts synapse_start.py next to the data; it moves SQLite to Postgres once (checked,
    # with a backup), then starts Synapse. Without it (an older unified-init), Synapse starts as before.
    entrypoint: [/bin/sh, -c]
    command:
      - 'if [ -f /data/synapse_start.py ]; then exec python /data/synapse_start.py; fi; exec python -m synapse.app.homeserver --config-path /data/homeserver.yaml'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    mem_limit: 768m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/matrix:/data
    depends_on:
      unified-init: {condition: service_completed_successfully}
      connector-init: {condition: service_completed_successfully}
      postgres: {condition: service_started}
    networks: [matrix-lane, postgres-lane]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Issue 451: the one-time move to Postgres runs before Synapse answers.
      start_period: 20m
    restart: unless-stopped
  postgres:
    # Issue 451: Synapse's database. It waits for unified-init's marker before it starts. Official
    # multi-architecture manifest.
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    user: "1000:1000"
    entrypoint: [/bin/sh, -c]
    command:
      - 'trap "exit 0" TERM INT; until [ -f /pg/enabled ]; do sleep 5 & wait $$!; done; exec docker-entrypoint.sh postgres'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /var/run/postgresql:rw,noexec,nosuid,size=8m,uid=1000,gid=1000
    mem_limit: 256m
    pids_limit: 64
    environment:
      PGDATA: /pg/db
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /pg/password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/pg
    depends_on:
      unified-init: {condition: service_completed_successfully}
    networks: [postgres-lane]
    stop_grace_period: 30s
    restart: unless-stopped
  livekit:
    # Issue 445 (switch calls): the LiveKit media server for calls. Official multi-architecture manifest, pinned.
    # It waits, running nothing, until Messenger puts calls/enabled (the switch is on), and stops LiveKit again
    # once the marker is gone; a new calls/livekit.gen (new TURN logins) restarts it. No published port: media
    # leaves the box outbound only.
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    user: "1000:1000"
    entrypoint: [/bin/sh, -c]
    command:
      - 'trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ]; do sleep 2 & wait $$!; done; g=$$(cat /calls/livekit.gen 2>/dev/null); /livekit-server --config /calls/livekit.yaml & p=$$!; while [ -f /calls/enabled ] && [ "$$(cat /calls/livekit.gen 2>/dev/null)" = "$$g" ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
    depends_on:
      unified-init: {condition: service_completed_successfully}
    networks: [call-lane, call-egress]
    stop_grace_period: 10s
    restart: unless-stopped
  call-auth:
    # Issue 445 (switch calls): LiveKit's token service for Matrix (element-hq lk-jwt-service 0.10.0, built into
    # Messenger's image from the pinned official one), as Synapse's application service. Idle like livekit above.
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    user: "1000:1000"
    entrypoint: [/bin/sh, -c]
    command:
      - 'trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ]; do sleep 2 & wait $$!; done; /usr/local/bin/lk-jwt-service & p=$$!; while [ -f /calls/enabled ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    mem_limit: 128m
    pids_limit: 64
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_KEY_FILE: /calls/livekit-keys.yaml
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_FULL_ACCESS_HOMESERVERS: messenger.internal
      LIVEKIT_AS_REGISTRATION_FILE: /calls/lk-jwt-registration.yaml
      LIVEKIT_HS_SERVER_NAME: messenger.internal
      LIVEKIT_CS_API_URL_OVERRIDES: messenger.internal=http://matrix:8008
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "30"
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
    depends_on:
      unified-init: {condition: service_completed_successfully}
    networks: [call-lane, matrix-lane]
    stop_grace_period: 10s
    restart: unless-stopped
  call-tunnel:
    # Issue 445 (switch calls): the guests' door, a Cloudflare Tunnel in the owner's own Cloudflare account
    # (call_cloudflare.py). cloudflared (built into Messenger's image from the pinned official one) only dials out to
    # Cloudflare: no port opens on the box. It runs only while the switch is on AND Messenger has made the tunnel
    # (calls/tunnel-token), and its one route is Messenger's call-only guest listener over tunnel-lane.
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    user: "1000:1000"
    entrypoint: [/bin/sh, -c]
    command:
      - 'trap "kill $$p 2>/dev/null; exit 0" TERM INT; while :; do until [ -f /calls/enabled ] && [ -s /calls/tunnel-token ]; do sleep 2 & wait $$!; done; /usr/local/bin/cloudflared tunnel --no-autoupdate --metrics 127.0.0.1:0 run --token-file /calls/tunnel-token & p=$$!; while [ -f /calls/enabled ] && [ -s /calls/tunnel-token ] && kill -0 $$p 2>/dev/null; do sleep 2 & wait $$!; done; kill $$p 2>/dev/null; wait $$p; done'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    mem_limit: 128m
    pids_limit: 64
    volumes:
      - ${APP_DATA_DIR}/data/calls:/calls:ro
    depends_on:
      unified-init: {condition: service_completed_successfully}
    networks: [tunnel-lane, call-egress]
    stop_grace_period: 10s
    restart: unless-stopped
  telegram:
    # Upstream bridgev2 + reproducible album patch; see plumbing/telegram-bridge.
    image: ${TELEGRAM_IMAGE:-ghcr.io/humanitylabs-org/wizard-telegram-bridge:sha-ca3f781e94cefe315adb464b6a37d84933d2bdb3@sha256:a41232b2e3f2b9786d5978540ede2e5bcfcde7de3309fa8178ec257a1cb5dc4b}
    user: "1000:1000"
    entrypoint: [/bin/sh, -c]
    command:
      - 'while [ ! -f /data/configured ]; do sleep 2; done; exec /usr/bin/mautrix-telegram -c /data/config.yaml'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ${APP_DATA_DIR}/data/telegram:/data
    depends_on:
      unified-init: {condition: service_completed_successfully}
      matrix: {condition: service_healthy}
    networks: [matrix-lane, telegram-egress]
    healthcheck:
      test: [CMD-SHELL, "test ! -f /data/configured || wget -q -O /dev/null http://127.0.0.1:29317/_matrix/mau/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  translation:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    entrypoint: [python3, /app/translation.py]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 768m: the translator that runs on the box (issue 209) holds one language both ways.
    mem_limit: 768m
    pids_limit: 64
    environment:
      TINFOIL_API_KEY: ${TINFOIL_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gemma4-31b}
      TRANSLATION_MODELS: /models
    volumes:
      - ${APP_DATA_DIR}/data/translation:/data:ro
      - ${APP_DATA_DIR}/data/translation-models:/models
    depends_on:
      unified-init: {condition: service_completed_successfully}
    networks: [model-lane, model-egress]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  connector-init:
    image: ${MESSENGER_IMAGE:-ghcr.io/humanitylabs-org/wizard-messenger:sha-b5868cc1fd4c7c39786fdb2c1d5adb608b016c57@sha256:515800865216c8a6af17a114d3994e6d9389490b7417a6f96d554504de8711d0}
    user: 0:0
    entrypoint:
    - python3
    - /app/connector_setup.py
    network_mode: none
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    security_opt:
    - no-new-privileges:true
    environment:
      MESSENGER_CONNECTORS: ${MESSENGER_CONNECTORS:-}
    volumes:
    - ${APP_DATA_DIR}/data:/data
    depends_on:
      unified-init:
        condition: service_completed_successfully
    restart: 'no'
    labels:
      runtipi.managed: 'false'
  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp@sha256:c807054cb015d0f5c90d20d85aac216d062b4a6f4ae834b931fd5e7f03e27391
    user: 1000:1000
    entrypoint:
    - /bin/sh
    - -c
    command:
    - until [ -f /data/configured ]; do sleep 2; done; exec /usr/bin/mautrix-whatsapp -c /data/config.yaml
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 128
    volumes:
    - ${APP_DATA_DIR}/data/whatsapp:/data
    depends_on:
      connector-init:
        condition: service_completed_successfully
      matrix:
        condition: service_healthy
    networks:
    - matrix-lane
    - connector-egress
    healthcheck:
      test:
      - CMD-SHELL
      - test ! -f /data/configured || curl --fail --silent http://127.0.0.1:29318/_matrix/mau/live
        >/dev/null
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  signal:
    image: dock.mau.dev/mautrix/signal@sha256:39afa721aa69472b2e91c75bd7d81a739e47f7e480fc0ff5ac8247af28eb2d0a
