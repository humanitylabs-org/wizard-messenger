    # Messenger's own normal Chromium (real browser on a virtual display, the Browser app's engine image) for
    # signing in to networks. Only Messenger reaches its DevTools (internal signin-lane); agents never do.
    # It starts empty, holds nothing between sign-ins, and each sign-in window is signed out and destroyed.
    image: ghcr.io/humanitylabs-org/browser-engine:sha-cb0e16812e95ff1c064de9f0f0e74cd4db2ff63f@sha256:11ffb8c2c1d53c42ec178dbc1ca6f710863043311dc16f3b375cc67d857010f5
