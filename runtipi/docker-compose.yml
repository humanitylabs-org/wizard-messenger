      BROWSER_SCREEN: 500x900
    networks:
    - signin-lane
    - signin-egress
    restart: unless-stopped
networks:
  matrix-lane: {internal: true}
  postgres-lane: {internal: true}
  # Issue 445: Messenger, LiveKit and its token service; LiveKit's media goes out through call-egress only.
  call-lane: {internal: true}
  call-egress: {}
  # Issue 445: only Messenger's guest listener and the call tunnel (cloudflared) share it.
  tunnel-lane: {internal: true}
  signin-lane: {internal: true}
  signin-egress: {}
  model-lane: {internal: true}
  telegram-egress: {}
  connector-egress: {}
  model-egress: {}
  # Existing Marmot relay traffic is preserved. Matrix has no egress network.
  relay-egress: {}
x-runtipi:
  schema_version: 2
  overrides: []
