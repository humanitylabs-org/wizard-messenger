    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    mem_limit: 512m
    pids_limit: 128
    volumes:
    - ${APP_DATA_DIR}/data/instagram:/data
    depends_on:
      connector-init:
        condition: service_completed_successfully
      matrix:
        condition: service_healthy
    networks:
    - matrix-lane
    - connector-egress
    healthcheck:
      test:
      - CMD-SHELL
      - test ! -f /data/configured || curl --fail --silent http://127.0.0.1:29330/_matrix/mau/live
        >/dev/null
      interval: 15s
      timeout: 5s
