# For the Messenger integrator: add this drop-in to the MAIN Wizard Messenger
# service after arranging WorkingDirectory=/opt/messenger and its venv. Do NOT
# apply to the independent service above. Example only; existing app core untouched.
# The guard deliberately exits nonzero with the shipped disabled JSON.
[Service]
ExecStartPre=/opt/messenger/.venv/bin/python -m isolated_sender.wizard_client preflight --config /etc/messenger/isolated-sender-client.json
